# Kinesis Advantage 360 Pro - Kconfig shared by both halves.
#
# These settings are applied on top of the upstream ZMK board definition
# (zmk/app/boards/kinesis/adv360pro). See https://zmk.dev/docs/config for the
# full list of available options.

# Keep the USB / Bluetooth identity of the stock Kinesis firmware
CONFIG_USB_DEVICE_VID=0x29EA
CONFIG_USB_DEVICE_PID=0x0362
CONFIG_USB_DEVICE_MANUFACTURER="Kinesis Corporation"
CONFIG_BT_DIS_MANUF_NAME_STR="Kinesis Corporation"

# Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Reporting the battery level over BLE can make some computers wake up
# repeatedly, so it is disabled. Set to y to enable it.
CONFIG_BT_BAS=n

# HID
# NKRO is enabled by the board definition. Uncomment the following line to also
# report F13-F24 and the INTL1-9 keys with NKRO (not compatible with Android).
# CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

# Pointing support, needed by the mouse click macros in macros.dtsi
CONFIG_ZMK_POINTING=y

# ZMK Studio (the left half is built with -DCONFIG_ZMK_STUDIO=y, see build.sh
# and .github/workflows/build.yml)
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
